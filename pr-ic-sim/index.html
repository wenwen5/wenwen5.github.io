    if (port.type !== 'bundled') throw new Error(`(${x},${y}) 不是集束端口`);

    return {
      tick: this.tick,
      analog: this.net.analog.slice(),
      bundle: this.net.bundle.slice(),
      gateState,

    return this.net.analogOfNode(this.net.nodeAt(cell, 0));

 *   `isOnBorder = x==0 || y==0 || x==w-1 || y==h-1` ⇒ 外圈 1 格是 IO 环；
 *   `OpGate.canPlace = !isOnBorder` ⇒ 普通门/导线只能放内部（16×16 板内区 14×14）；
 *   `OpIOGate.canPlace = isOnBorder && !isOnEdge` ⇒ IO 端口只能在环上且四角不行。
 */

                                                                                
const { DIR_VEC, absoluteDir } = require('model/types.js');
const { partSpec } = require('model/catalog.js');

const GRID_SIZES = [16, 32, 48, 64]         ;

function isGridSize(n        )          {
  return (GRID_SIZES                     ).includes(n);
}

const MIN_GRID = 16;
const MAX_GRID = 64;

function idx(bp           , x        , y        )         {
  return y * bp.w + x;
}

function inBounds(bp           , x        , y        )          {
  return x >= 0 && y >= 0 && x < bp.w && y < bp.h;
}

/** 是否位于最外一圈 IO 环 */
function isRing(bp           , x        , y        )          {
  return x === 0 || y === 0 || x === bp.w - 1 || y === bp.h - 1;
}

/** 是否位于四角（环上但不能放 IO） */
function isCorner(bp           , x        , y        )          {
  return (x === 0 || x === bp.w - 1) && (y === 0 || y === bp.h - 1);
}

function cellAt(bp           , x        , y        )              {
  if (!inBounds(bp, x, y)) return null;
  return bp.cells[idx(bp, x, y)] ?? null;
}

function partAt(bp           , x        , y        )                 {
  return cellAt(bp, x, y)?.part ?? null;
}

function ioAt(bp           , x        , y        )                {
  return cellAt(bp, x, y)?.io ?? null;
}

/** 单元格 (x,y) 在方向 d 上的邻居坐标 */
function neighbor(x        , y        , d     )                   {
  const [dx, dy] = DIR_VEC[d];
  return [x + dx, y + dy];
}

/** 某条边上的格子顺序（上/下自左向右，左/右自上向下） */
function edgeCells(bp           , side     )                          {
  const out                          = [];
  if (side === 0) for (let x = 0; x < bp.w; x++) out.push([x, 0]);
  else if (side === 2) for (let x = 0; x < bp.w; x++) out.push([x, bp.h - 1]);
  else if (side === 3) for (let y = 0; y < bp.h; y++) out.push([0, y]);
  else for (let y = 0; y < bp.h; y++) out.push([bp.w - 1, y]);
  return out;
}

/** 端口朝内的邻居格（IO 端口与内部电路的接触点） */
function ioInnerNeighbor(bp           , x        , y        )                   {
  if (y === 0) return [x, 1];
  if (y === bp.h - 1) return [x, bp.h - 2];
  if (x === 0) return [1, y];
  if (x === bp.w - 1) return [bp.w - 2, y];
  throw new Error(`(${x},${y}) 不在 IO 环上`);
}

/** 端口所在的边（= 端口的 rotation，源码 `OpIOGate.findRot`） */
function sideOfRing(bp           , x        , y        )      {
  if (y === 0) return 0;
  if (y === bp.h - 1) return 2;
  if (x === 0) return 3;
  if (x === bp.w - 1) return 1;
  throw new Error(`(${x},${y}) 不在 IO 环上`);
}

                                 
                             
                  
             
             
 

function createBlueprint(name        , w        , h        )            {
  if (!isGridSize(w) || !isGridSize(h)) {
    throw new Error(`蓝图尺寸必须每维取自 ${GRID_SIZES.join('/')}，收到 ${w}×${h}`);
  }
  const cells         = new Array(w * h);
  for (let i = 0; i < cells.length; i++) cells[i] = { part: null, io: null };
  return { name, w, h, cells, meta: {} };
}

/** 便捷构造：把元件放到 (x,y) */
function placePart(
  bp           ,
  x        ,
  y        ,
  kind        ,
  rot      = 0,
  shape = 0,
  params                         = {},
)          {
  const s = partSpec(kind);
  const merged                         = {};
  for (const p of s.params) merged[p.key] = p.def;
  Object.assign(merged, params);
  const c = cellAt(bp, x, y);
  if (!c) throw new Error(`坐标越界: (${x},${y})`);
  const part          = { kind, rot, shape, params: merged };
  c.part = part;
  return part;
}

/** 便捷构造：在环上放 IO 端口（自动推导 side 与 index） */
function placeIO(
  bp           ,
  x        ,
  y        ,
  type        ,
  mode                ,
  freq = 0,
)         {
  if (!isRing(bp, x, y)) throw new Error(`(${x},${y}) 不在 IO 环上`);
  if (isCorner(bp, x, y)) throw new Error(`(${x},${y}) 是角落，不能放 IO`);
  const side = sideOfRing(bp, x, y);
  const cells = edgeCells(bp, side);
  const index = cells.findIndex(([cx, cy]) => cx === x && cy === y);
  // 与游戏一致：新放下的 IO 端口默认不通信号（电平 0；集束端口所有频道关）
  const port         = { type, mode, side, index, freq, driven: 0, channels: new Array(16).fill(0) };
  const c = cellAt(bp, x, y);
  if (!c) throw new Error(`坐标越界: (${x},${y})`);
  c.io = port;
  return port;
}

/** 校验蓝图的结构合法性 */
function validateBlueprint(bp           )                   {
  const issues                   = [];
  if (!isGridSize(bp.w) || !isGridSize(bp.h)) {
    issues.push({ level: 'error', message: `尺寸 ${bp.w}×${bp.h} 非法，每维必须是 16/32/48/64` });
  }
  if (bp.cells.length !== bp.w * bp.h) {
    issues.push({ level: 'error', message: `cells 长度 ${bp.cells.length} 与 ${bp.w}×${bp.h} 不符` });
    return issues;
  }

  const perSide = new Map                                                                              ();
  const pending = new Set        ();

  for (let y = 0; y < bp.h; y++) {
    for (let x = 0; x < bp.w; x++) {
      const c = bp.cells[idx(bp, x, y)];
      const ring = isRing(bp, x, y);

      if (c.io) {
        if (!ring) issues.push({ level: 'error', message: 'IO 端口只能放在最外一圈', x, y });
        if (isCorner(bp, x, y)) issues.push({ level: 'error', message: '四角不能放 IO 端口', x, y });
        const slot = perSide.get(c.io.side) ?? { type: null, simple: 0, ports: 0, freqs: [] };
        if (slot.type !== null && slot.type !== c.io.type) {
          issues.push({ level: 'error', message: `同一条边只能声明一种 IO 类型（${slot.type} 与 ${c.io.type} 冲突）`, x, y });
        }
        slot.type = c.io.type;
        slot.ports++;
        if (c.io.type === 'simple') slot.simple++;
        if (c.io.type !== 'simple') {
          if (slot.freqs.includes(c.io.freq)) {
            issues.push({ level: 'error', message: `同一条边上 ${c.io.type} IO 的 freq=${c.io.freq} 重复`, x, y });
          }
          slot.freqs.push(c.io.freq);
        }
        perSide.set(c.io.side, slot);
      }

      if (c.part) {
        if (ring) issues.push({ level: 'error', message: 'IO 环上只能放 IO 端口，不能放元件', x, y });
        let s;
        try {
          s = partSpec(c.part.kind);
        } catch {
          issues.push({ level: 'error', message: `未知元件 ${c.part.kind}`, x, y });
          continue;
        }
        if (s.impl === 'pending') pending.add(c.part.kind);
      }
    }
  }

  for (const [side, slot] of perSide) {
    const name = ['上', '右', '下', '左'][side];
    if (slot.type === 'simple' && slot.simple > 1) {
      issues.push({ level: 'error', message: `${name}边放了 ${slot.simple} 个 Simple IO；一条边只能声明一个 Simple IO` });
    }
    const maxPorts = side === 0 || side === 2 ? bp.w - 2 : bp.h - 2;
    if (slot.ports > maxPorts) {
      issues.push({ level: 'error', message: `${name}边端口数 ${slot.ports} 超过可用长度 ${maxPorts}（四角不可用）` });
    }
  }

  if (pending.size > 0) {
    issues.push({ level: 'error', message: `以下元件行为尚未实现: ${[...pending].join(', ')}` });
  }

  return issues;
}

/** 检查每个 IO 端口是否有内部接触（内侧相邻格必须是线缆） */
function findDanglingIO(bp           )                          {
  const out                          = [];
  for (let y = 0; y < bp.h; y++) {
    for (let x = 0; x < bp.w; x++) {
      if (!ioAt(bp, x, y)) continue;
      const [ix, iy] = ioInnerNeighbor(bp, x, y);
      const inner = partAt(bp, ix, iy);
      if (!inner || partSpec(inner.kind).category !== 'wire') out.push([x, y]);
    }
  }
  return out;
}

/** 元件的某个内部边对应的绝对方向 */
function partAbsoluteDir(part         , internal     )      {
  return absoluteDir(internal, part.rot);
}

// ------------------------------------------------------------------ 序列化

const BLUEPRINT_FORMAT = 'pr-ic-sim/blueprint@2';

function serializeBlueprint(bp           )         {
  return JSON.stringify(
    {
      format: BLUEPRINT_FORMAT,
      name: bp.name,
      w: bp.w,
      h: bp.h,
      meta: bp.meta,
      cells: bp.cells.map((c) => {
        const o                          = {};
        if (c.part) o.part = { kind: c.part.kind, rot: c.part.rot, shape: c.part.shape, params: c.part.params };
        if (c.io) {
          o.io = {
            type: c.io.type,
            mode: c.io.mode,
            side: c.io.side,
            index: c.io.index,
            freq: c.io.freq,
            driven: c.io.driven,
            channels: c.io.channels,
          };
        }
        return o;
      }),
      // 预留：后续接入游戏 .icbp / 分享串格式时，在此登记源格式与版本
      sourceFormat: null,
    },
    null,
    2,
  );
}

/** 预留接口：从游戏蓝图（.icbp / 分享串 / NBT）导入，尚未实现 */
function importGameBlueprint(_payload        )            {
  throw new Error('尚未实现：游戏 .icbp / 分享串导入。见 README 的「蓝图互通」章节');
}

function deserializeBlueprint(text        )            {
  const raw = JSON.parse(text)                           ;
  if (raw.format !== BLUEPRINT_FORMAT) {
    throw new Error(`不支持的蓝图格式: ${String(raw.format)}（当前只支持 ${BLUEPRINT_FORMAT}）`);
  }
  const w = raw.w          ;
  const h = raw.h          ;
  if (!isGridSize(w) || !isGridSize(h)) throw new Error(`蓝图尺寸非法: ${w}×${h}`);
  const src = raw.cells                                  ;
  if (!Array.isArray(src) || src.length !== w * h) throw new Error('cells 长度与尺寸不符');
  const cells         = src.map((o) => {
    const part = (o.part                       ) ?? null;
    const io = (o.io                      ) ?? null;
    return {
      part: part ? { kind: part.kind, rot: part.rot, shape: part.shape ?? 0, params: { ...part.params } } : null,
      io: io
        ? {
            type: io.type,
            mode: io.mode,
            side: io.side,
            index: io.index ?? 0,
            freq: io.freq ?? 0,
            driven: io.driven ?? -1,
            channels: io.channels ? [...io.channels] : new Array(16).fill(0),
          }
        : null,
    };
  });
  return { name: String(raw.name ?? 'untitled'), w, h, cells, meta: (raw.meta                           ) ?? {} };
}

      b.textContent = `${w}×${h}`;
      b.onclick = () => {
        state.bp = createBlueprint(state.bp.name, w, h);
        state.probes = [];
        state.selected = null;
        rebuildEngine();
        fitView();
        back.remove();
        renderAll();
      };
      grid.appendChild(b);
    }
  }
  box.appendChild(grid);
  const nameRow = document.createElement('div');
  nameRow.style.marginTop = '10px';
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.value = state.bp.name;
  nameInput.onchange = () => {
    state.bp.name = nameInput.value || 'untitled';
  };
  nameRow.appendChild(nameInput);
  box.appendChild(nameRow);
  box.appendChild(button('取消', () => back.remove()));
  back.appendChild(box);
  back.onclick = (e) => {
    if (e.target === back) back.remove();
  };
  document.body.appendChild(back);
}

// ---------------------------------------------------------------- 蓝图 IO

function saveBlueprint()       {
  const blob = new Blob([serializeBlueprint(state.bp)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${state.bp.name || 'blueprint'}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function loadBlueprint()       {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const file = input.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        state.bp = deserializeBlueprint(String(reader.result));
        state.probes = [];
        state.selected = null;
        rebuildEngine();
        fitView();
        renderAll();
      } catch (err) {
        state.error = `载入失败: ${(err         ).message}`;
        renderStatus();
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ---------------------------------------------------------------- 绘制

function cellPx()         {
  return CELL * state.zoom;
}

/** 把整块棋盘按视口大小缩放居中（新建/载入/点「适配视图」时调用） */
function fitView()       {
  const [W, H] = measureView();
  const s = Math.min(W / (state.bp.w + 4), H / (state.bp.h + 4));
  state.zoom = Math.max(0.5, Math.min(3, Math.round((s / CELL) * 10) / 10));
  state.panX = 0;
  state.panY = 0;
  state.viewW = W;
  state.viewH = H;
}

/** 世界坐标（棋盘格坐标，可为小数）→ 屏幕像素 */
function toScreen(gx        , gy        )                   {
  const s = cellPx();
  return [state.viewW / 2 + state.panX + gx * s, state.viewH / 2 + state.panY + gy * s];
}

function toCell(px        , py        )                           {
  const s = cellPx();
  const gx = (px - state.viewW / 2 - state.panX) / s;
  const gy = (py - state.viewH / 2 - state.panY) / s;
  return { x: Math.floor(gx), y: Math.floor(gy) };
}

function heat(level        )         {
  if (!state.showSignals || level <= 0) return '#4a5058';
  const t = Math.min(1, level / 15);
  const r = Math.round(90 + 165 * t);
  const g = Math.round(70 + 60 * t);
  const b = Math.round(60 + 40 * t);
  return `rgb(${r},${g},${b})`;
}

function draw()       {
  const dpr = window.devicePixelRatio || 1;
  const [W, H] = measureView();
  if (W <= 1 || H <= 1) return;
  state.viewW = W;
  state.viewH = H;
  // 只写 canvas 的尺寸，不读回来；同时用 style 把 CSS 尺寸钉死，杜绝反馈自激
  if (canvas.width !== Math.floor(W * dpr) || canvas.height !== Math.floor(H * dpr)) {
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
  }
  canvas.style.width = `${W}px`;
  canvas.style.height = `${H}px`;
  ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx2d.clearRect(0, 0, W, H);
  ctx2d.fillStyle = '#101216';
  ctx2d.fillRect(0, 0, W, H);

  const bp = state.bp;
  const s = cellPx();
  const engine = state.engine;

  // 底板
  const [ox, oy] = toScreen(0, 0);
  ctx2d.fillStyle = '#191c21';
  ctx2d.fillRect(ox, oy, bp.w * s, bp.h * s);
  ctx2d.fillStyle = '#241f18';
  ctx2d.fillRect(ox, oy, bp.w * s, s);
  ctx2d.fillRect(ox, oy + (bp.h - 1) * s, bp.w * s, s);
  ctx2d.fillRect(ox, oy, s, bp.h * s);
  ctx2d.fillRect(ox + (bp.w - 1) * s, oy, s, bp.h * s);

  // 网格
  ctx2d.lineWidth = 1;
  for (let x = 0; x <= bp.w; x++) {
    ctx2d.strokeStyle = x % 4 === 0 ? '#2c3138' : '#20242a';
    ctx2d.beginPath();
    ctx2d.moveTo(Math.round(ox + x * s) + 0.5, oy);
    ctx2d.lineTo(Math.round(ox + x * s) + 0.5, oy + bp.h * s);
    ctx2d.stroke();
  }
  for (let y = 0; y <= bp.h; y++) {
    ctx2d.strokeStyle = y % 4 === 0 ? '#2c3138' : '#20242a';
    ctx2d.beginPath();
    ctx2d.moveTo(ox, Math.round(oy + y * s) + 0.5);
    ctx2d.lineTo(ox + bp.w * s, Math.round(oy + y * s) + 0.5);
    ctx2d.stroke();
  }
  ctx2d.strokeStyle = '#4a5361';
  ctx2d.strokeRect(ox + 0.5, oy + 0.5, bp.w * s, bp.h * s);

  if (s >= 8) {
    for (let y = 0; y < bp.h; y++) {
      for (let x = 0; x < bp.w; x++) {
        drawCell(x, y, s);
      }
    }
  }

  // 悬停 / 选中 / 探针
  if (state.hover) outline(state.hover.x, state.hover.y, '#ffffff88', s);
  if (state.selected) outline(state.selected.x, state.selected.y, '#ff9d2e', s);
  for (const p of state.probes) outline(p.x, p.y, '#e05be0', s);

  void engine;
}

function outline(x        , y        , colour        , s        )       {
  const [px, py] = toScreen(x, y);
  ctx2d.strokeStyle = colour;
  ctx2d.lineWidth = 2;
  ctx2d.strokeRect(px + 1, py + 1, s - 2, s - 2);
}

function drawCell(x        , y        , s        )       {
  const [px, py] = toScreen(x, y);
  const part = partAt(state.bp, x, y);
  const port = ioAt(state.bp, x, y);

  if (port) {
    const engine = state.engine;
    const reading = engine ? safeRead(engine, x, y) : null;
    const typeColour = port.type === 'simple' ? '#5bd66a' : port.type === 'analog' ? '#5bd6ff' : '#e05be0';
    ctx2d.fillStyle = port.mode === 'input' ? '#1c2a22' : '#2a1f1c';
    ctx2d.fillRect(px + 1, py + 1, s - 2, s - 2);
    ctx2d.strokeStyle = typeColour;
    ctx2d.lineWidth = 2;
    ctx2d.strokeRect(px + 1.5, py + 1.5, s - 3, s - 3);
    if (s >= 14) {
      ctx2d.fillStyle = reading && reading.level > 0 ? '#ffffff' : typeColour;
      ctx2d.font = `${Math.max(8, s * 0.42)}px ui-monospace, monospace`;
      ctx2d.textAlign = 'center';
      ctx2d.textBaseline = 'middle';
      const tag = port.type === 'simple' ? 'S' : port.type === 'analog' ? 'A' : 'B';
      ctx2d.fillText(`${tag}${port.mode === 'input' ? '↓' : '↑'}`, px + s / 2, py + s / 2 - (s >= 20 ? 3 : 0));
      if (s >= 20 && port.type !== 'simple') {
        ctx2d.font = `${Math.max(7, s * 0.3)}px ui-monospace, monospace`;
        ctx2d.fillStyle = '#8b95a3';
        ctx2d.fillText(`#${port.freq}`, px + s / 2, py + s / 2 + s * 0.28);
      }
    }
    return;
  }

  if (!part) return;
  const spec = partSpec(part.kind);
  const engine = state.engine;

  if (spec.category === 'wire') {
    drawWireCell(x, y, s, part);
    return;
  }
  if (spec.category === 'array') {
    drawArrayCell(x, y, s, part);
    return;
  }

  // 门 / 调试元件
  const debugOn = spec.category === 'debug' ? (engine ? engine.emitterOn(x, y) : false) : false;
  ctx2d.fillStyle =
    spec.category === 'debug' ? (debugOn ? '#4a4520' : '#2a2a1c') : '#2f3540';
  ctx2d.strokeStyle =
    spec.category === 'debug' ? (debugOn ? '#ffd24a' : '#6b6b3a') : '#4a5361';
  ctx2d.lineWidth = 1;
  roundRect(px + 1, py + 1, s - 2, s - 2, Math.min(4, s * 0.2));
  ctx2d.fill();
  ctx2d.stroke();

  if (engine && spec.category !== 'debug') {
    const logic = GATE_LOGIC[part.kind];
    if (logic) {
      // 输入/输出边
      const inMask = logic.inputMask(part.shape);
      const outMask = logic.outputMask(part.shape);
      const outMaskState = engine.gateOutputMask(x, y);
      for (let r = 0       ; r < 4; r = (r + 1)       ) {
        const a = absoluteDir(r, part.rot);
        const [dx, dy] = DIR_VEC[a];
        const cx = px + s / 2 + (dx * s) / 2;
        const cy = py + s / 2 + (dy * s) / 2;
        if ((outMask & (1 << r)) !== 0) {
          ctx2d.fillStyle = (outMaskState & (1 << r)) !== 0 ? heat(15) : '#4a5058';
          ctx2d.beginPath();
          ctx2d.arc(cx, cy, Math.max(1.6, s * 0.09), 0, Math.PI * 2);
          ctx2d.fill();
        } else if ((inMask & (1 << r)) !== 0) {
          ctx2d.strokeStyle = '#6b7684';
          ctx2d.beginPath();
          ctx2d.arc(cx, cy, Math.max(1.4, s * 0.08), 0, Math.PI * 2);
          ctx2d.stroke();
        }
      }
    }
  }

  if (s >= 15) {
    ctx2d.fillStyle = spec.category === 'debug' ? '#e8d98a' : '#d8dee6';
    ctx2d.font = `${Math.max(8, s * 0.36)}px ui-monospace, monospace`;
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'middle';
    const label = part.kind === 'dbg.torch' ? '火把' : part.kind === 'dbg.lever' ? '拉杆' : part.kind === 'dbg.button' ? '按钮' : shortLabel(part.kind);
    ctx2d.fillText(label, px + s / 2, py + s / 2);
  }
}

function shortLabel(kind        )         {
  const map                         = {
    'gate.not': 'NOT',
    'gate.and': 'AND',
    'gate.or': 'OR',
    'gate.nand': 'NAND',
    'gate.nor': 'NOR',
    'gate.xor': 'XOR',
    'gate.xnor': 'XNOR',
    'gate.buffer': 'BUF',
    'gate.multiplexer': 'MUX',
    'gate.pulse_former': 'PULSE',
    'gate.repeater': 'RPT',
    'gate.timer': 'TMR',
    'gate.sequencer': 'SEQ',
    'gate.sr_latch': 'SR',
    'gate.toggle_latch': 'TGL',
    'gate.transparent_latch': 'LAT',
    'gate.counter': 'CNT',
    'gate.state_cell': 'ST',
    'gate.synchronizer': 'SYN',
    'gate.randomizer': 'RND',
    'gate.dec_randomizer': 'DRND',
  };
  return map[kind] ?? partSpec(kind).en.slice(0, 4).toUpperCase();
}

function drawWireCell(x        , y        , s        , part                                                  )       {
  const engine = state.engine;
  const cell = x + y * state.bp.w;
  const isBundle = part.kind === 'wire.bundled';
  const insulated = part.kind === 'wire.insulated';
  const dx = x;
  const dy = y;

  let level = 0;
  let mask = 0;
  if (engine) {
    if (isBundle) {
      const node = engine.net.nodeAt(cell, 0);
      mask = engine.net.bundleMaskOfNode(node);
      let maxCh = 0;
      for (let c = 0; c < 16; c++) maxCh = Math.max(maxCh, engine.net.bundleOfNode(node, c));
      level = vanillaLevel(maxCh);
    } else {
      level = vanillaLevel(engine.wireStrength(x, y));
    }
  }

  const colour = isBundle
    ? mask !== 0
      ? heat(level)
      : '#3a4048'
    : insulated
      ? level > 0
        ? DYE[COLOR_NAMES[part.params.colour ?? 0] ?? 'red']
        : shade(DYE[COLOR_NAMES[part.params.colour ?? 0] ?? 'red'], 0.45)
      : heat(level);

  ctx2d.strokeStyle = colour;
  ctx2d.lineWidth = Math.max(2, s * 0.16);
  ctx2d.lineCap = 'round';
  const cxr = toScreen(dx, dy)[0] + s / 2;
  const cyr = toScreen(dx, dy)[1] + s / 2;

  const connects = (d     )          => {
    const [ddx, ddy] = DIR_VEC[d];
    const nx = dx + ddx;
    const ny = dy + ddy;
    if (!inBounds(state.bp, nx, ny)) return false;
    const other = partAt(state.bp, nx, ny);
    return wiresConnect(part         , other);
  };

  ctx2d.beginPath();
  ctx2d.moveTo(cxr, cyr);
  for (const d of [0, 1, 2, 3]         ) {
    if (!connects(d)) continue;
    const [ddx, ddy] = DIR_VEC[d];
    ctx2d.moveTo(cxr, cyr);
    ctx2d.lineTo(cxr + (ddx * s) / 2, cyr + (ddy * s) / 2);
  }
  ctx2d.stroke();

  // 中心点
  ctx2d.fillStyle = colour;
  ctx2d.beginPath();
  ctx2d.arc(cxr, cyr, Math.max(2, s * 0.16), 0, Math.PI * 2);
  ctx2d.fill();

  if (s >= 22) {
    ctx2d.fillStyle = '#8b95a3';
    ctx2d.font = `${Math.max(7, s * 0.24)}px ui-monospace, monospace`;
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'top';
    ctx2d.fillText(isBundle ? mask.toString(16) : String(level), cxr, cyr + s * 0.12);
  }
}

function drawArrayCell(x        , y        , s        , part                            )       {
  const [px, py] = toScreen(x, y);
  const engine = state.engine;
  ctx2d.fillStyle = '#2a2f38';
  roundRect(px + 1, py + 1, s - 2, s - 2, Math.min(4, s * 0.2));
  ctx2d.fill();

  const s0 = engine ? engine.arrayChannelStrength(x, y, 0) : 0;
  const s1 = engine ? engine.arrayChannelStrength(x, y, 1) : 0;

  ctx2d.lineWidth = Math.max(2, s * 0.15);
  ctx2d.lineCap = 'round';
  // 通道 0 = 内部 0x5（南北），通道 1 = 内部 0xa（东西）
  const ns = [DIR_VEC[absoluteDir(0, part.rot)], DIR_VEC[absoluteDir(2, part.rot)]];
  const ew = [DIR_VEC[absoluteDir(1, part.rot)], DIR_VEC[absoluteDir(3, part.rot)]];
  ctx2d.strokeStyle = heat(vanillaLevel(s0));
  ctx2d.beginPath();
  for (const [dx, dy] of ns) {
    ctx2d.moveTo(px + s / 2, py + s / 2);
    ctx2d.lineTo(px + s / 2 + (dx * s) / 2, py + s / 2 + (dy * s) / 2);
  }
  ctx2d.stroke();
  ctx2d.strokeStyle = heat(vanillaLevel(s1));
  ctx2d.beginPath();
  for (const [dx, dy] of ew) {
    ctx2d.moveTo(px + s / 2, py + s / 2);
    ctx2d.lineTo(px + s / 2 + (dx * s) / 2, py + s / 2 + (dy * s) / 2);
  }
  ctx2d.stroke();

  if (s >= 20) {
    ctx2d.fillStyle = '#d8dee6';
    ctx2d.font = `${Math.max(7, s * 0.26)}px ui-monospace, monospace`;
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'middle';
    ctx2d.fillText(part.kind === 'gate.null_cell' ? '空' : part.kind === 'gate.buffer_cell' ? '缓' : '反', px + s / 2, py + s / 2);
  }
}

function roundRect(x        , y        , w        , h        , r        )       {
  ctx2d.beginPath();
  ctx2d.moveTo(x + r, y);
  ctx2d.lineTo(x + w - r, y);
  ctx2d.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx2d.lineTo(x + w, y + h - r);
  ctx2d.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx2d.lineTo(x + r, y + h);
  ctx2d.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx2d.lineTo(x, y + r);
  ctx2d.quadraticCurveTo(x, y, x + r, y);
  ctx2d.closePath();
}

function shade(hex        , f        )         {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * f);
  const g = Math.round(((n >> 8) & 255) * f);
  const b = Math.round((n & 255) * f);
  return `rgb(${r},${g},${b})`;
}

function safeRead(engine        , x        , y        )                           {
  try {
    return engine.readIO(x, y);
  } catch {
    return null;
  }
}

// ---------------------------------------------------------------- 交互

function applyTool(from                          , to                          )       {
  const bp = state.bp;
  const tool = state.tool;
  let changed = false;

  if (tool.kind === 'erase') {
    const x0 = Math.min(from.x, to.x);
    const x1 = Math.max(from.x, to.x);
    const y0 = Math.min(from.y, to.y);
    const y1 = Math.max(from.y, to.y);
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        if (!inBounds(bp, x, y)) continue;
        const c = bp.cells[y * bp.w + x];
        if (c.part || c.io) {
          c.part = null;
          c.io = null;
          changed = true;
        }
      }
    }
  } else if (tool.kind === 'io') {
    if (!isRing(bp, from.x, from.y) || isCorner(bp, from.x, from.y)) {
      state.message = 'IO 端口只能放在最外一圈、且四角不行';
      return;
    }
    const c = bp.cells[from.y * bp.w + from.x];
    c.io = makePort(bp, from.x, from.y, tool.ioType, tool.mode, tool.freq);
    changed = true;
  } else if (tool.kind === 'part') {
    const spec = partSpec(tool.part);
    if (spec.category === 'wire') {
      // 沿轴投影逐格填线（源码 OpWire）
      const horizontal = Math.abs(to.x - from.x) >= Math.abs(to.y - from.y);
      const steps = horizontal ? Math.abs(to.x - from.x) : Math.abs(to.y - from.y);
      for (let i = 0; i <= steps; i++) {
        const x = horizontal ? from.x + Math.sign(to.x - from.x) * i : from.x;
        const y = horizontal ? from.y : from.y + Math.sign(to.y - from.y) * i;
        if (!inBounds(bp, x, y) || isRing(bp, x, y)) continue;
        placePart(bp, x, y, tool.part, tool.rot, tool.shape, tool.params);
        changed = true;
      }
    } else {
      if (!inBounds(bp, from.x, from.y) || isRing(bp, from.x, from.y)) {
        state.message = '元件只能放在 IO 环以内';
        return;
      }
      // 拖动方向定朝向（源码 OpGate.findRot）
      let rot      = tool.rot;
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      if (Math.abs(dx) > Math.abs(dy)) rot = dx > 0 ? 1 : 3;
      else if (dx !== 0 || dy !== 0) rot = dy > 0 ? 2 : 0;
      placePart(bp, from.x, from.y, tool.part, rot, tool.shape, tool.params);
      changed = true;
    }
  }

  if (changed) {
    rebuildEngine();
    // 放下元件后自动选中它，方便立刻在检视面板里调朝向/参数
    if (tool.kind === 'part' || tool.kind === 'io') state.selected = { x: from.x, y: from.y };
    state.message = `已修改 @(${from.x},${from.y})${state.error ? ` — ${state.error}` : ''}`;
  }
}

function makePort(bp           , x        , y        , ioType        , mode                    , freq        )         {
  const side = sideOfRing(bp, x, y);
  const cells = edgeCells(bp, side);
  const index = cells.findIndex(([cx, cy]) => cx === x && cy === y);
  // 与游戏一致：新放下的 IO 端口默认**不通信号**（电平 0 / 所有频道关）
  return { type: ioType, mode, side, index, freq, driven: 0, channels: new Array(16).fill(0) };
}

function initMouse()       {
  const wrap = el('boardWrap');

  wrap.addEventListener('mousedown', (ev) => {
    const rect = canvas.getBoundingClientRect();
    const cell = toCell(ev.clientX - rect.left, ev.clientY - rect.top);
    if (ev.button === 2) {
      if (inBounds(state.bp, cell.x, cell.y)) {
        state.selected = cell;
        renderInspector();
      }
      return;
    }
    state.drag = {
      x: cell.x,
      y: cell.y,
      button: ev.button,
      panX: state.panX,
      panY: state.panY,
      panning: ev.shiftKey,
      mx: ev.clientX,
      my: ev.clientY,
    };
    if (state.tool.kind === 'select' && !ev.shiftKey) {
      // 左键 = 与元件交互（源码 `part.onClicked()` → `activate()`）：
      //   拉杆 → 切换开关；按钮 → 按下（20 tick 后自动弹起）；IO 输入端口 → 调试通电/断电
      const part = partAt(state.bp, cell.x, cell.y);
      const port = ioAt(state.bp, cell.x, cell.y);
      let acted = false;
      if (part?.kind === 'dbg.lever' && state.engine) {
        state.engine.toggleLever(cell.x, cell.y);
        acted = true;
      } else if (part?.kind === 'dbg.button' && state.engine) {
        state.engine.pressButton(cell.x, cell.y);
        acted = true;
      } else if (port && port.mode === 'input') {
        if (port.type === 'bundled') {
          port.channels[port.freq] = port.channels[port.freq] ? 0 : 1;
        } else if (port.type === 'analog') {
          port.driven = port.driven > 0 && port.driven === port.freq ? 0 : port.freq;
        } else {
          port.driven = port.driven > 0 ? 0 : 15;
        }
        acted = true;
      }
      if (acted) {
        // 暂停状态下也要能看到静态电平变化：手动求一次不动点
        if (!state.running) state.engine?.refresh();
        state.message = `@(${cell.x},${cell.y}) 已切换输入`;
      }
      state.selected = cell;
      renderInspector();
      renderStatus();
      draw();
    }
  });

  window.addEventListener('mousemove', (ev) => {
    const rect = canvas.getBoundingClientRect();
    const px = ev.clientX - rect.left;
    const py = ev.clientY - rect.top;
    if (state.drag && state.drag.panning) {
      state.panX = state.drag.panX + (ev.clientX - state.drag.mx);
      state.panY = state.drag.panY + (ev.clientY - state.drag.my);
      draw();
      return;
    }
    if (px < 0 || py < 0 || px > state.viewW || py > state.viewH) {
      state.hover = null;
    } else {
      state.hover = toCell(px, py);
    }
    renderStatus();
    draw();
  });

  window.addEventListener('mouseup', (ev) => {
    const drag = state.drag;
    state.drag = null;
    if (!drag) return;
    const rect = canvas.getBoundingClientRect();
    const cell = toCell(ev.clientX - rect.left, ev.clientY - rect.top);
    if (drag.panning) return;
    if (ev.button !== 0) return;
    if (state.tool.kind === 'select') return;
    if (!inBounds(state.bp, drag.x, drag.y)) return;
    applyTool({ x: drag.x, y: drag.y }, cell);
    renderInspector();
    renderStatus();
    draw();
  });

  window.addEventListener('contextmenu', (ev) => {
    if (ev.target === canvas) ev.preventDefault();
  });

  wrap.addEventListener(
    'wheel',
    (ev) => {
      ev.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const before = toCell(ev.clientX - rect.left, ev.clientY - rect.top);
      const dir = ev.deltaY < 0 ? 0.1 : -0.1;
      state.zoom = Math.max(0.5, Math.min(3, Math.round((state.zoom + dir) * 10) / 10));
      const after = toCell(ev.clientX - rect.left, ev.clientY - rect.top);
      const s = cellPx();
      state.panX += (after.x - before.x) * s;
      state.panY += (after.y - before.y) * s;
      draw();
      renderToolbar();
    },
    { passive: false },
  );

  window.addEventListener('keydown', (ev) => {
    if (ev.key === 'e' || ev.key === 'E') {
      state.tool = { kind: 'erase' };
      renderPalette();
    } else if (ev.key === 'Escape') {
      state.tool = { kind: 'select' };
      state.selected = null;
      renderPalette();
      renderInspector();
    } else if (ev.key === ' ') {
      ev.preventDefault();
      state.running = !state.running;
      renderToolbar();
    } else if (ev.key === 'p' || ev.key === 'P') {
      if (state.hover) toggleProbe(state.hover.x, state.hover.y);
    }
  });

  window.addEventListener('resize', () => draw());
}

function toggleProbe(x        , y        )       {
  const i = state.probes.findIndex((p) => p.x === x && p.y === y);
  if (i >= 0) state.probes.splice(i, 1);
  else if (state.probes.length < 6) state.probes.push({ x, y });
  renderProbes();
  draw();
}

// ---------------------------------------------------------------- 检视面板

function renderInspector()       {
  const root = el('inspector');
  root.innerHTML = '';
  const sel = state.selected;
  const h = document.createElement('h4');
  h.textContent = '检视 / 配置';
  root.appendChild(h);

  if (!sel) {
    root.appendChild(text('右键元件打开配置面板；左键点 IO 端口可切换调试电平。'));
    root.appendChild(hint('操作提示：\n左键拖动 = 使用当前工具\nShift+拖动 = 平移棋盘\n滚轮 = 缩放 0.5~3.0\nE = 橡皮擦，Esc = 取消，空格 = 运行/暂停\nP = 给悬停格加探针'));
    return;
  }

  const part = partAt(state.bp, sel.x, sel.y);
  const port = ioAt(state.bp, sel.x, sel.y);
  const kv = document.createElement('div');
  kv.className = 'kv';
  const addKV = (k        , v        )       => {
    const a = document.createElement('div');
    a.textContent = k;
    const b = document.createElement('div');
    b.textContent = v;
    kv.append(a, b);
  };
  addKV('坐标', `(${sel.x}, ${sel.y})`);
  addKV('环上', isRing(state.bp, sel.x, sel.y) ? '是' : '否');
  if (state.engine) addKV('状态', state.engine.describe(sel.x, sel.y));
  if (state.error) addKV('校验', state.error);
  root.appendChild(kv);

  const probeBtn = button(state.probes.some((p) => p.x === sel.x && p.y === sel.y) ? '移除探针' : '加为探针', () =>
    toggleProbe(sel.x, sel.y),
  );
  root.appendChild(probeBtn);

  if (part) {
    const spec = partSpec(part.kind);
    root.appendChild(heading(`元件：${spec.zh}（${part.kind}）`));
    const rotRow = document.createElement('div');
    rotRow.className = 'row';
    rotRow.append(text('朝向'));
    for (let r = 0; r < 4; r++) {
      rotRow.appendChild(
        button(['↑', '→', '↓', '←'][r], () => {
          part.rot = r       ;
          rebuildEngine();
          renderInspector();
          draw();
        }, part.rot === r),
      );
    }
    root.appendChild(rotRow);

    const maxShape = part.kind === 'gate.timer' || part.kind === 'gate.sequencer' ? 1 : 15;
    const shapeRow = document.createElement('div');
    shapeRow.className = 'row';
    shapeRow.append(text('shape'));
    for (const s of [0, 1, 2, 3]) {
      if (s > maxShape) break;
      shapeRow.appendChild(
        button(String(s), () => {
          part.shape = s;
          rebuildEngine();
          renderInspector();
          draw();
        }, part.shape === s),
      );
    }
    root.appendChild(shapeRow);

    for (const p of spec.params) {
      const row = document.createElement('div');
      row.className = 'row';
      row.style.marginTop = '4px';
      const lab = text(`${p.label}`);
      const input = document.createElement('input');
      input.type = 'number';
      input.min = String(p.min);
      input.max = String(p.max);
      input.value = String(part.params[p.key] ?? p.def);
      input.style.width = '90px';
      input.onchange = () => {
        part.params[p.key] = Number(input.value);
        rebuildEngine();
        draw();
      };
      row.append(lab, input);
      root.appendChild(row);
    }
    root.appendChild(
      button('删除该元件', () => {
        const c = state.bp.cells[sel.y * state.bp.w + sel.x];
        c.part = null;
        rebuildEngine();
        renderInspector();
        draw();
      }),
    );
  }

  if (port) {
    root.appendChild(heading(`IO 端口：${port.type} / ${port.mode} / 边 ${['上', '右', '下', '左'][port.side]}`));
    const typeRow = document.createElement('div');
    typeRow.className = 'row';
    typeRow.append(text('类型'));
    for (const t of ['simple', 'analog', 'bundled']            ) {
      typeRow.appendChild(
        button(t, () => {
          port.type = t;
          port.freq = t === 'simple' ? 0 : port.freq;
          rebuildEngine();
          renderInspector();
          draw();
        }, port.type === t),
      );
    }
    root.appendChild(typeRow);

    const modeRow = document.createElement('div');
    modeRow.className = 'row';
    modeRow.appendChild(
      button('输入', () => {
        port.mode = 'input';
        rebuildEngine();
        renderInspector();
        draw();
      }, port.mode === 'input'),
    );
    modeRow.appendChild(
      button('输出', () => {
        port.mode = 'output';
        rebuildEngine();
        renderInspector();
        draw();
      }, port.mode === 'output'),
    );
    root.appendChild(modeRow);

    const freqRow = document.createElement('div');
    freqRow.className = 'row';
    freqRow.append(text('freq'));
    const freqInput = document.createElement('input');
    freqInput.type = 'number';
    freqInput.min = '0';
    freqInput.max = '15';
    freqInput.value = String(port.freq);
    freqInput.style.width = '70px';
    freqInput.onchange = () => {
      port.freq = Math.max(0, Math.min(15, Number(freqInput.value)));
      rebuildEngine();
      draw();
    };
    freqRow.appendChild(freqInput);
    root.appendChild(freqRow);

    if (port.mode === 'input') {
      const drv = document.createElement('div');
      drv.className = 'row';
      drv.append(text('调试电平'));
      const dinput = document.createElement('input');
      dinput.type = 'number';
      dinput.min = '0';
      dinput.max = '15';
      dinput.value = String(port.driven);
      dinput.style.width = '70px';
      dinput.onchange = () => {
        port.driven = Math.max(0, Math.min(15, Number(dinput.value)));
        if (!state.running) state.engine?.refresh();
        renderStatus();
        draw();
      };
      drv.appendChild(dinput);
      root.appendChild(drv);
    }
    root.appendChild(
      button('删除该端口', () => {
        state.bp.cells[sel.y * state.bp.w + sel.x].io = null;
        rebuildEngine();
        renderInspector();
        draw();
      }),
    );
  }
}

function heading(s        )              {
  const h = document.createElement('h4');
  h.textContent = s;
  return h;
}

function hint(s        )              {
  const d = document.createElement('div');
  d.className = 'hint';
  d.style.whiteSpace = 'pre-line';
  d.textContent = s;
  return d;
}

// ---------------------------------------------------------------- 状态行 / 探针表

function renderStatus()       {
  const engine = state.engine;
  const parts           = [];
  parts.push(`tick ${engine ? engine.tick : 0}`);
  parts.push(`尺寸 ${state.bp.w}×${state.bp.h}`);
  if (state.hover) {
    const { x, y } = state.hover;
    parts.push(`(${x},${y}) ${engine ? engine.describe(x, y) : '—'}`);
  } else {
    parts.push('把鼠标移到格子上查看状态');
  }
  if (state.message) parts.push(state.message);
  if (state.error) parts.push(`⚠ ${state.error}`);
  if (engine && engine.warnings.length) parts.push(engine.warnings[0]);
  el('status').textContent = parts.join('  |  ');
}

function recordRow()       {
  const engine = state.engine;
  if (!engine) return;
  const cells = state.probes.map((p) => {
    const c = state.bp.cells[p.y * state.bp.w + p.x];
    if (!c) return '-';
    if (c.io) {
      const r = engine.readIO(p.x, p.y);
      return c.io.type === 'bundled' ? `0x${r.bundleMask.toString(16)}` : String(r.level);
    }
    if (!c.part) return '-';
    const spec = partSpec(c.part.kind);
    if (spec.category === 'wire') {
      if (c.part.kind === 'wire.bundled') {
        const node = engine.net.nodeAt(p.y * state.bp.w + p.x, 0);
        return `0x${engine.net.bundleMaskOfNode(node).toString(16)}`;
      }
      const s = engine.wireStrength(p.x, p.y);
      return `${vanillaLevel(s)}`;
    }
    if (spec.category === 'array') {
      return `${vanillaLevel(engine.arrayChannelStrength(p.x, p.y, 0))}|${vanillaLevel(engine.arrayChannelStrength(p.x, p.y, 1))}`;
    }
    if (spec.category === 'debug') return c.part.kind === 'dbg.torch' ? '1' : `0x${engine.gateState(p.x, p.y).toString(16)}`;
    return `0x${engine.gateOutputMask(p.x, p.y).toString(16)}`;
  });
  state.rows.push([String(engine.tick), ...cells]);
  if (state.rows.length > 40) state.rows.shift();
}

let lastProbeRender = 0;
/** 探针表最多每 100ms 重建一次，避免高速度下每 tick 都动 DOM */
function maybeRenderProbes(now        )       {
  if (now - lastProbeRender < 100) return;
  lastProbeRender = now;
  renderProbes();
}

function renderProbes()       {
  const root = el('probes');
  root.innerHTML = '';
  if (state.probes.length === 0) {
    root.appendChild(hint('探针：把鼠标移到格子上按 P 添加（最多 6 个），这里会逐 tick 记录读数。'));
    return;
  }
  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const hr = document.createElement('tr');
  for (const label of ['tick', ...state.probes.map((p) => `@(${p.x},${p.y})`)]) {
    const th = document.createElement('th');
    th.textContent = label;
    hr.appendChild(th);
  }
  thead.appendChild(hr);
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  for (const row of state.rows.slice().reverse()) {
    const tr = document.createElement('tr');
    for (const v of row) {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  root.appendChild(table);
}

// ---------------------------------------------------------------- 主循环

let lastTime = 0;
let acc = 0;

function frame(now        )       {
  const dt = lastTime === 0 ? 0 : (now - lastTime) / 1000;
  lastTime = now;
  if (state.running && state.engine) {
    acc += dt * state.speed;
    let steps = 0;
    while (acc >= 1 && steps < 200) {
      state.engine.step();
      recordRow();
      acc -= 1;
      steps++;
    }
    if (steps > 0) {
      draw();
      renderStatus();
      maybeRenderProbes(now);
    }
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- 启动

function renderAll()       {
  renderToolbar();
  renderPalette();
  renderInspector();
  renderStatus();
  renderProbes();
  draw();
  renderToolbar();
}

function main()       {
  rebuildEngine();
  initMouse();
  fitView(); // 打开就把整块棋盘适配进视口，避免 64×64 时"找不到格子"
  renderAll();
  (globalThis                                      ).__icSimDebug = { state, toScreen, toCell, cellPx, canvas };
  requestAnimationFrame(frame);
}

main();
